name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore tests/BlazorCN.Tests/BlazorCN.Tests.csproj

      - name: Build
        run: dotnet build tests/BlazorCN.Tests/BlazorCN.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/BlazorCN.Tests/BlazorCN.Tests.csproj -c Release --no-build

      - name: Pack (validation only)
        run: dotnet pack src/BlazorCN/BlazorCN.csproj -c Release --no-build -o artifacts/nupkg
