name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore BlazorCN.slnx

      - name: Build
        run: dotnet build BlazorCN.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/BlazorCN.Tests/BlazorCN.Tests.csproj -c Release --no-build

      - name: Pack (validation only)
        run: dotnet pack src/BlazorCN/BlazorCN.csproj -c Release --no-build -o artifacts/nupkg
