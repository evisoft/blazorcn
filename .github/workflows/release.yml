name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore BlazorCN.slnx

      - name: Build
        run: dotnet build BlazorCN.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/BlazorCN.Tests/BlazorCN.Tests.csproj -c Release --no-build

      - name: Pack
        run: >
          dotnet pack src/BlazorCN/BlazorCN.csproj -c Release --no-build
          -o artifacts/nupkg
          -p:Version=${{ steps.version.outputs.version }}

      - name: Push to NuGet.org
        run: >
          dotnet nuget push "artifacts/nupkg/*.nupkg"
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/nupkg/*.nupkg
          generate_release_notes: true
